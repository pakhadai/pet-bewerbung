<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FOUC fix: apply dark theme before React hydrates -->
    <script>
      if (localStorage.getItem('pet-bewerbung-theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    </script>
    
    <!-- Primary Meta Tags -->
    <title>Pet-Bewerbung | Professionelles Haustier-CV für Ihre Wohnungsbewerbung</title>
    <meta name="title" content="Pet-Bewerbung | Professionelles Haustier-CV für Ihre Wohnungsbewerbung" />
    <meta name="description" content="Erstellen Sie ein professionelles Bewerbungsdossier für Ihr Haustier. Steigern Sie Ihre Chancen bei der Wohnungssuche in der Schweiz mit einem überzeugenden Pet-CV." />
    <meta name="keywords" content="Pet CV, Haustier Bewerbung, Wohnungssuche Schweiz, Hund Bewerbung, Katze Bewerbung, Mietwohnung Haustier" />
    <meta name="author" content="Pet-Bewerbung.ch" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pet-bewerbung.ch/" />
    <!-- Umami: no preconnect here — script loads after idle (see src/utils/umami.ts); head preconnect was flagged unused and hurt Lighthouse. -->

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pet-bewerbung.ch/" />
    <meta property="og:title" content="Pet-Bewerbung | Professionelles Haustier-CV" />
    <meta property="og:description" content="Erstellen Sie ein professionelles Bewerbungsdossier für Ihr Haustier. Steigern Sie Ihre Chancen bei der Wohnungssuche in der Schweiz!" />
    <meta property="og:image" content="https://pet-bewerbung.ch/og-image.jpg" />
    <meta property="og:locale" content="de_CH" />
    <meta property="og:site_name" content="Pet-Bewerbung.ch" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://pet-bewerbung.ch/" />
    <meta property="twitter:title" content="Pet-Bewerbung | Professionelles Haustier-CV" />
    <meta property="twitter:description" content="Erstellen Sie ein professionelles Bewerbungsdossier für Ihr Haustier. Steigern Sie Ihre Chancen bei der Wohnungssuche!" />
    <meta property="twitter:image" content="https://pet-bewerbung.ch/og-image.jpg" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.webp" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#b39ddb" />
    
    <!-- Fonts: self-hosted; preload body text face early (parallel with JS, helps LCP/FCP). -->
    <link
      rel="preload"
      href="/fonts/6xK-dSZaM9iE8KbpRA_LJ3z8mH9BOJvgkP8o18E.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="preload" href="/logo-header.webp" as="image" type="image/webp" />

    <!-- Umami: loaded from src/utils/umami.ts after requestIdleCallback (no head script here). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
