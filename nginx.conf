server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://analytics.umami.is https://cloud.umami.is; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://analytics.umami.is https://cloud.umami.is https://api-gateway.umami.dev; frame-src 'none'; worker-src 'self' blob:;" always;

    location = /favicon.ico { expires 1y; add_header Cache-Control "public, immutable"; log_not_found off; access_log off; }
    location = /logo.webp { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /apple-touch-icon.webp { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /android-chrome-192x192.webp { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /android-chrome-512x512.webp { expires 1y; add_header Cache-Control "public, immutable"; }
    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location = /robots.txt { expires 1d; add_header Cache-Control "public"; }
    location = /sitemap.xml { expires 1d; add_header Cache-Control "public"; }
    location = /site.webmanifest { expires 7d; add_header Cache-Control "public"; }
    location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location = /index.html {
        etag on;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
