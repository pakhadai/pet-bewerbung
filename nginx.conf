server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    
    # Apple Pay Domain Verification
    location /.well-known/ {
        default_type text/plain;
    }
    
    # Favicon - явний шлях (найвищий пріоритет)
    location = /favicon.ico {
        expires 1y;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        access_log off;
    }
    
    # Інші фавікони та статичні файли
    location ^~ /favicon {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ^~ /apple-touch-icon {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ^~ /android-chrome {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location = /logo.png {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location = /site.webmanifest {
        add_header Cache-Control "public, max-age=604800";
        default_type application/manifest+json;
    }
    
    # Vite збілджені ассети (JS, CSS з хешами)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Фронтенд (React SPA) - fallback для всього іншого
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Бекенд (API)
    location /api/ {
        # Прибираємо /api префікс при передачі на бекенд
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:4242;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
        # Для webhook потрібно передавати raw body
        client_max_body_size 1m;
        # Обробка помилок - не перенаправляти на frontend
        proxy_intercept_errors off;
    }
}