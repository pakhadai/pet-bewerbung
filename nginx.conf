server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    
    # ============================================
    # Security Headers
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://generativelanguage.googleapis.com; frame-src 'none'; worker-src 'self' blob:;" always;
    
    # HSTS - uncomment after confirming HTTPS works correctly
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Favicon - явний шлях (найвищий пріоритет)
    location = /favicon.ico {
        expires 1y;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        access_log off;
    }
    
    # Інші фавікони та статичні файли
    location ^~ /favicon {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ^~ /apple-touch-icon {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ^~ /android-chrome {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location = /logo.png {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location = /site.webmanifest {
        add_header Cache-Control "public, max-age=604800";
        default_type application/manifest+json;
    }
    
    # Vite збілджені ассети (JS, CSS з хешами)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # index.html – no-cache allows revalidation; ETag for 304 responses
    location = /index.html {
        etag on;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Фронтенд (React SPA) - fallback для всього іншого
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Бекенд (API)
    location /api/ {
        # Прибираємо /api префікс при передачі на бекенд
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:4242;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache_bypass $http_upgrade;
        # Для webhook потрібно передавати raw body
        client_max_body_size 1m;
        # Обробка помилок - не перенаправляти на frontend
        proxy_intercept_errors off;
    }
}