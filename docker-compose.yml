services:
  # Фронтенд + Nginx
  frontend:
    build: .
    container_name: pet-frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - pet-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Бекенд (Node.js)
  backend:
    build: ./server
    container_name: pet-backend
    restart: always
    networks:
      - pet-network
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_RATE_LIMIT=${AI_RATE_LIMIT:-3}
      - PORT=4242
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4242/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Cloudflare Tunnel (з'єднує локальний сервер з pet.ohmyrevit.pp.ua)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pet-tunnel
    restart: always
    command: >
      sh -c "
      echo '⏳ Очікування готовності frontend (10 секунд)...';
      sleep 10;
      if [ -z \"$$TUNNEL_TOKEN\" ]; then
        echo '❌ ERROR: TUNNEL_TOKEN не встановлено!';
        exit 1;
      fi;
      echo '🚀 Запуск Cloudflare Tunnel...';
      echo '🌐 Target: pet.ohmyrevit.pp.ua -> frontend:80';
      exec cloudflared tunnel --no-autoupdate --loglevel info run --token \"$$TUNNEL_TOKEN\"
      "
    depends_on:
      frontend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TUNNEL_TRANSPORT_PROTOCOL=quic
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_RETRIES=10
      - TUNNEL_GRACE_PERIOD=30s
    networks:
      - pet-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pgrep cloudflared || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pet-network:
    driver: bridge