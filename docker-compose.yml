services:
  frontend:
    build: .
    container_name: pet-frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - pet-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: pet-tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    env_file: .env
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      - TUNNEL_TRANSPORT_PROTOCOL=quic
    networks:
      - pet-network

networks:
  pet-network:
    driver: bridge
