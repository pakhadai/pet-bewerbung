name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/root/apps/pet-bewerbung"
          rm: false
          overwrite: true

      - name: Execute deployment commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/apps/pet-bewerbung

            # Use server-local .env (managed directly on VPS).
            if [ ! -f .env ]; then
              echo "ERROR: /root/apps/pet-bewerbung/.env not found on VPS."
              exit 1
            fi

            # Rebuild if code or Dockerfile changed
            docker compose build

            # Restart containers in detached mode
            docker compose up -d

            # Cleanup dangling images
            docker image prune -f
